# Единственный владелец жизненного цикла — dockerd. unless-stopped переживает
# падение/перезапуск демона: контейнер, который был явно остановлен (docker stop,
# как это делает deploy.sh при свапе цвета), остаётся выключенным; контейнер,
# который был жив и погас вместе с демоном — поднимается сам. Проверено на
# практике (см. learnings.md).
x-backend-common: &backend-common
  build:
    context: ./backend
  env_file:
    - .env.backend
  extra_hosts:
    - "db:192.168.64.5"
  cap_drop:
    - ALL
  read_only: true
  stop_grace_period: 15s
  restart: unless-stopped
  networks:
    - app-net
  volumes:
    - /home/jahongir/certs/ca.crt:/certs/ca.crt:ro

services:
  backend-blue:
    <<: *backend-common
    image: backend:blue
    container_name: backend-blue

  backend-green:
    <<: *backend-common
    image: backend:green
    container_name: backend-green

  nginx:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: nginx
    stop_grace_period: 15s
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/jahongir/certs:/etc/nginx/certs:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

networks:
  app-net:
    external: true
