# Единственный владелец жизненного цикла — dockerd. unless-stopped переживает
# падение/перезапуск демона: контейнер, который был явно остановлен (docker stop,
# как это делает deploy.sh при свапе цвета), остаётся выключенным; контейнер,
# который был жив и погас вместе с демоном — поднимается сам. Проверено на
# практике (см. learnings.md).
x-backend-common: &backend-common
  build:
    context: ./backend
  env_file:
    - .env.backend
  extra_hosts:
    - "db:192.168.64.5"
  cap_drop:
    - ALL
  read_only: true
  mem_limit: 256m
  memswap_limit: 256m
  environment:
    S3_ENDPOINT: "minio:9000"
    S3_BUCKET: "uploads"
    S3_ACCESS_KEY: "${S3_ACCESS_KEY:?задай S3_ACCESS_KEY в файле .env}"
    S3_SECRET_KEY: "${S3_SECRET_KEY:?задай S3_SECRET_KEY в файле .env}"
    REDIS_HOST: "redis"
    REDIS_PASSWORD: "${REDIS_PASSWORD:?задай REDIS_PASSWORD в файле .env}"
  stop_grace_period: 15s
  restart: unless-stopped
  networks:
    - app-net
  volumes:
    - /home/jahongir/certs/ca.crt:/certs/ca.crt:ro

services:
  backend-blue:
    <<: *backend-common
    image: backend:blue
    container_name: backend-blue

  backend-green:
    <<: *backend-common
    image: backend:green
    container_name: backend-green

  nginx:
    image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
    container_name: nginx
    stop_grace_period: 15s
    restart: unless-stopped
    networks:
      - app-net
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/jahongir/certs:/etc/nginx/certs:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    container_name: redis
    # Без секции ports: порт 6379 не опубликован на хост, достучаться можно только из контейнеров в app-net по имени "redis".
    user: redis
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?задай REDIS_PASSWORD в файле .env}"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-lru
      - --appendonly
      - "yes"
    mem_limit: 128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    stop_grace_period: 15s
    restart: unless-stopped
    networks:
      - app-net
    volumes:
      - redis-data:/data

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    container_name: minio
# Порты 9000/9001 не публикуются: S3 API доступен только из app-net по адресу minio:9000.
    user: "10001:10001"
    command: ["minio", "server", "/data"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?задай MINIO_ROOT_USER в файле .env}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?задай MINIO_ROOT_PASSWORD в файле .env}"
    mem_limit: 384m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 15s
    restart: unless-stopped
    networks:
      - app-net
    volumes:
      - type: bind
        source: /srv/minio/data
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  app-net:
    external: true

volumes:
  redis-data:
    name: redis-data
